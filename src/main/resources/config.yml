# Event - 1v1 Turnuva Sistemi | Jestron
# Renk: & kodları. Bir mesajı kapatmak için değerini "" yap.

ayarlar:
  saat-dilimi: "Europe/Istanbul"
  # Event açılınca /event ile katılım süresi (saniye)
  katilim-suresi: 300
  minimum-oyuncu: 2
  ilk-tur-bekleme: 5
  tur-arasi-bekleme: 5
  # Maç öncesi geri sayım (hareket/vuruş kapalı)
  mac-geri-sayim: 3
  # Maç süre sınırı (saniye, 0 = sınırsız). Süre bitince canı yüksek olan kazanır
  mac-max-sure: 180
  # Kazananın odadan bekleme alanına dönmeden önceki beklemesi
  mac-sonu-bekleme: 3
  # Katılım süresince duyuru yapılacak saniyeler
  geri-sayim-duyurulari: [240, 180, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Event saatinden kaç dakika önce tüm oyunculara title ile hatırlatma yapılsın
  hatirlatma-dakikalari: [60, 30, 10, 5, 1]
  bekleme-alani-hasar: false
  bekleme-alani-aclik: false
  # Maçta blok koyma / haritanın bloklarını kırma (maç bitince oda eski haline döner)
  oda-blok-koyma: true
  oda-blok-kirma: false
  # WorldGuard vb. odalarda PvP/blok engelliyorsa maç içinde zorla izin ver
  izinleri-zorla: true
  # Rakip çıkarsa/ayrılırsa kazanana kill sayılsın mı
  cikis-kill-sayilsin: false
  olum-mesaji-gizle: true
  # Eventteyken kullanılabilecek komutlar (/event her zaman serbest)
  izinli-komutlar: [msg, tell, w, r, reply]
  # Sonuçta gösterilecek oyuncu sayısı
  sonuc-gosterilecek: 3

# Sıralama ödülleri (konsoldan). Değişkenler: %player% %sira% %kill%
oduller:
  '1':
    - "give %player% diamond 5"
  '2':
    - "give %player% diamond 3"
  '3':
    - "give %player% diamond 1"
# En az 1 maç yapan herkese
katilim-odulu: []

