# ╔══════════════════════════════════════════════════════════╗
# ║                 Event - 1v1 Turnuva Sistemi               ║
# ║                    Geliştirici: Jestron                   ║
# ╚══════════════════════════════════════════════════════════╝
# Renk kodları: & ile (örn &a, &l). Bir mesajı tamamen kapatmak için değerini "" yapın.

ayarlar:
  # Event saatlerinin hangi saat dilimine göre çalışacağı
  saat-dilimi: "Europe/Istanbul"
  # Event saati gelince /event ile katılımın açık kalacağı süre (saniye). 300 = 5 dakika
  katilim-suresi: 300
  # Turnuvanın başlaması için gereken en az oyuncu
  minimum-oyuncu: 2
  # Katılım bitince ilk turun başlamasından önceki bekleme (saniye)
  ilk-tur-bekleme: 5
  # İki tur arasındaki bekleme (saniye)
  tur-arasi-bekleme: 5
  # Maç başlamadan önceki geri sayım (saniye). Bu sürede oyuncular hareket edemez / vuramaz
  mac-geri-sayim: 3
  # Bir maçın en uzun süresi (saniye). 0 = sınırsız. Süre bitince canı yüksek olan kazanır
  mac-max-sure: 180
  # Maç bitince kazananın bekleme alanına dönmeden önce odada beklediği süre (saniye)
  mac-sonu-bekleme: 3
  # Katılım süresince bu saniyelerde herkese duyuru yapılır
  geri-sayim-duyurulari: [240, 180, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Katılırken envanterin boş olması zorunlu mu? (false = eşyalar güvenle veritabanına alınır, sonra iade edilir)
  envanter-bos-olmali: false
  # Bekleme alanında oyuncular hasar alabilir mi? (düşme, lav vb.)
  bekleme-alani-hasar: false
  # Bekleme alanında açlık düşsün mü?
  bekleme-alani-aclik: false
  # Odalarda maç sırasında blok koyulabilsin mi? (maç bitince hepsi eski haline döner)
  oda-blok-koyma: true
  # Odalarda maç sırasında haritanın orijinal blokları kırılabilsin mi? (maç bitince geri gelir)
  oda-blok-kirma: false
  # Maç sırasında yere eşya atılabilsin mi?
  mac-esya-atma: false
  # Başka eklentiler (WorldGuard vb.) odalarda PvP / blok koymayı engelliyorsa maç içinde zorla izin ver
  izinleri-zorla: true
  # Rakibi oyundan çıkarsa / eventten ayrılırsa kazanana kill sayılsın mı?
  cikis-kill-sayilsin: false
  # Event ölüm mesajlarını gizle
  olum-mesaji-gizle: true
  # Evente katılanların kullanabileceği komutlar (/event her zaman serbest)
  izinli-komutlar: [msg, tell, w, r, reply]
  # Sonuç tablosunda kaç oyuncu gösterilsin
  sonuc-gosterilecek: 3

# Ödüller: sıralamaya göre konsoldan çalıştırılacak komutlar
# Değişkenler: %player% %sira% %kill%
oduller:
  '1':
    - "give %player% diamond 5"
  '2':
    - "give %player% diamond 3"
  '3':
    - "give %player% diamond 1"
# Elenmeden önce en az 1 maç yapan herkese verilecek (boş bırakılabilir)
katilim-odulu: []

sesler:
